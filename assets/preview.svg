<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" role="img" aria-labelledby="title">
  <title id="title">Illustration of the script's menu and summary in a terminal window</title>
  <rect width="820" height="470" rx="10" fill="#0c0c0c"/>
  <path d="M0 10a10 10 0 0 1 10-10h800a10 10 0 0 1 10 10v26H0z" fill="#2b2b2b"/>
  <rect x="14" y="12" width="6" height="6" fill="#f25022"/>
  <rect x="21" y="12" width="6" height="6" fill="#7fba00"/>
  <rect x="14" y="19" width="6" height="6" fill="#00a4ef"/>
  <rect x="21" y="19" width="6" height="6" fill="#ffb900"/>
  <text x="38" y="23" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#cccccc">Win11_Batch_Upgrade.bat</text>
  <g font-family="Cascadia Mono, Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14" fill="#cccccc">
    <text x="18" y="62" fill="#ffffff">&#160;What should happen on each PC?</text>
    <text x="18" y="84">&#160;&#160;&#160;1 = Force restart: PC restarts by itself when ready</text>
    <text x="18" y="106">&#160;&#160;&#160;2 = User restarts: upgrade finishes on the next restart. Try on one PC first</text>
    <text x="18" y="128">&#160;&#160;&#160;3 = Check status: changes nothing, shows how far each PC is</text>
    <text x="18" y="160">Choose 1, 2 or 3: <tspan fill="#61d6d6">1</tspan></text>
    <text x="18" y="192" fill="#767676">============================================================</text>
    <text x="18" y="214" fill="#ffffff">&#160;SUMMARY</text>
    <text x="18" y="236" fill="#767676">============================================================</text>
    <text x="18" y="268" fill="#16c60c">&#160;SUCCEEDED (2):</text>
    <text x="18" y="290">&#160;&#160;&#160;&#160;PC01&#160;&#160;(Health Check installed, upgrade started)</text>
    <text x="18" y="312">&#160;&#160;&#160;&#160;PC02&#160;&#160;(Health Check installed, upgrade started)</text>
    <text x="18" y="344" fill="#f9f1a5">&#160;SKIPPED (1):</text>
    <text x="18" y="366">&#160;&#160;&#160;&#160;PC03&#160;&#160;(Already Windows 11, build 22631)</text>
    <text x="18" y="398" fill="#e74856">&#160;FAILED (1):</text>
    <text x="18" y="420">&#160;&#160;&#160;&#160;PC04&#160;&#160;(TPM 2.0 not found)</text>
    <text x="18" y="452" fill="#767676">&#160;Full log: Win11Upgrade_results.log</text>
  </g>
</svg>
